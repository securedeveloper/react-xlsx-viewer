name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        # React 18 and 19 (react-xlsx-viewer's peer range is >=18 <20, docs/api.md §12 Q3).
        react: [18, 19]
    env:
      # Asserted by the test suite, so a job can't silently run on the wrong React.
      REACT_MAJOR: ${{ matrix.react }}
      SMOKE_REACT: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # React 19 is the committed default: install exactly from the lockfile.
      - name: Install (lockfile)
        if: matrix.react == 19
        run: npm ci

      # React 18: rewrite the dev ranges and resolve a fresh tree (see the script).
      - name: Install (React ${{ matrix.react }})
        if: matrix.react != 19
        run: node scripts/use-react.mjs ${{ matrix.react }}

      - name: Resolved versions
        run: node scripts/print-versions.mjs

      - name: Typecheck (library + playground)
        if: matrix.react == 19
        run: npm run typecheck

      - name: Typecheck (library)
        if: matrix.react != 19
        run: npm run typecheck -w react-xlsx-viewer

      - name: Test
        run: npm test

      - name: Release script unit tests
        run: npm run test:release

      - name: Build library
        run: npm run build -w react-xlsx-viewer

      # OPS-11: react-xlsx-viewer depends on javascript-excel only (peers: react,
      # react-dom), and only dist/ + README + LICENSE + package.json are
      # published. A new runtime dependency means changing this allowlist in
      # the same pull request.
      - name: Dependency guard (runtime allowlist, tarball contents)
        run: node scripts/check-deps.mjs --package packages/react-xlsx-viewer --allow javascript-excel --peer react,react-dom --pack

      - name: Lint package (publint + are-the-types-wrong)
        if: matrix.react == 19
        run: npm run lint:pkg

      - name: Smoke test packed tarball (ESM, CJS, types, "use client")
        run: npm run smoke

      - name: Build playground
        if: matrix.react == 19
        run: npm run build -w playground

      - name: npm pack --dry-run
        if: matrix.react == 19 && matrix.node == 24
        run: npm pack --dry-run -w react-xlsx-viewer

  # The required check. One stable name for the whole matrix above.
  ci:
    name: CI
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Node / React cell passed
        run: test "${{ needs.test.result }}" = success

  # The package in a real browser (test/browser, Vitest browser mode + Playwright
  # Chromium): layout, focus and scrolling, which jsdom does not have; the conformance
  # corpus and the generated hostile files; then visual regression (test/visual)
  # against the committed baselines. Not a required check yet.
  #
  # It runs in a pinned Playwright image, so the OS, system libraries and fonts are the
  # same on every run and the screenshots stay comparable. scripts/visual.sh runs the
  # same image locally; keep the two image tags in step (docs/visual-testing.md).
  browser:
    name: Browser
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Metric-compatible fonts for Calibri and Cambria (the font map, docs/ux.md §8.3); the
      # image already has Liberation (Arial, Times New Roman, Courier New).
      - name: Fonts
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea
          fc-list : family | grep -E 'Carlito|Caladea|Liberation Sans' | sort -u
      - name: Chromium (headless shell)
        run: |
          v=$(npm -w react-xlsx-viewer exec -- playwright --version | awk '{print $2}')
          if [ "$v" != "1.65.1" ]; then
            echo "::warning::Playwright $v differs from the container image (1.65.1): bump the image tag here and in scripts/visual.sh, and refresh the visual baselines."
          fi
          npm -w react-xlsx-viewer exec -- playwright install --only-shell chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Visual regression
        run: npm run test:visual
      # On a mismatch: the actual screenshots and the diffs, for review or as new baselines.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: |
            packages/react-xlsx-viewer/.vitest-attachments
            packages/react-xlsx-viewer/test/visual/__screenshots__
          if-no-files-found: ignore

  # The conformance corpus in LibreOffice next to the viewer's baselines
  # (scripts/libreoffice-compare.mjs). Reported as an artifact, not gating: it measures
  # fidelity, and LibreOffice isn't Excel.
  libreoffice:
    name: LibreOffice comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install LibreOffice Calc (headless) and poppler
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea
          soffice --version
      - name: Render the corpus
        run: node scripts/libreoffice-compare.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: visual-comparison
          path: visual-comparison
          retention-days: 14

  # The Performance harness (packages/react-xlsx-viewer/test/perf, docs/api.md §9) in
  # Chromium: scroll frames, keyboard and click response, DOM size, copy and summary
  # cost, opening an .xlsx. Reports to the job summary and an artifact; not required.
  performance:
    name: Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(npm -w react-xlsx-viewer exec -- playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell
      - name: Install Chromium (headless shell) and its system libraries
        run: npm -w react-xlsx-viewer exec -- playwright install --with-deps --only-shell chromium
      - name: Performance harness
        run: npm -w react-xlsx-viewer run perf
      - name: Summary
        run: node scripts/perf-summary.mjs
      - name: Bundle size
        run: npm run build -w react-xlsx-viewer && node scripts/bundle-size.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: performance
          path: packages/react-xlsx-viewer/perf-results.json

  # Consumer TypeScript matrix: one tarball, type-checked by a consumer project
  # on several TypeScript versions, @types/react majors and moduleResolution modes.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build -w react-xlsx-viewer
      - name: npm pack
        run: |
          mkdir -p pack
          npm pack -w react-xlsx-viewer --pack-destination pack
          mv pack/*.tgz pack/react-xlsx-viewer.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: pack/react-xlsx-viewer.tgz
          retention-days: 3

  consumer-ts:
    name: Consumer TS ${{ matrix.ts }} / @types/react ${{ matrix.react }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every minor from the supported floor (5.0) up, same set as the other family packages.
        ts: ['5.0', '5.1', '5.2', '5.3', '5.4', '5.5', '5.6', '5.7', '5.8', '5.9', '6.0', '7.0']
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: pack
      - name: Type-check consumer fixture
        run: >-
          node scripts/consumer-ts.mjs
          --tarball pack/react-xlsx-viewer.tgz
          --ts ${{ matrix.ts }}
          --react ${{ matrix.react }}
          --resolution node16,nodenext,bundler

  # Single stable name for the consumer matrix.
  consumer-ts-result:
    name: Consumer TS
    needs: consumer-ts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All consumer TypeScript cells passed
        run: test "${{ needs.consumer-ts.result }}" = success

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: packages/react-xlsx-viewer
    steps:
      # On a pull_request, HEAD is the test merge commit and HEAD~1 is the
      # base branch tip, so the release check below previews what merging
      # this PR would do.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Release script unit tests
        run: node --test "scripts/*.test.mjs"
      - name: Release preview (what merging this would publish)
        id: check
        run: node scripts/release-check.mjs --package "$PACKAGE_DIR"
      - run: npm run build --if-present
      - name: npm pack --dry-run
        run: npm pack "./$PACKAGE_DIR" --dry-run
      - name: npm publish --dry-run
        env:
          PUBLISHED: ${{ steps.check.outputs.published }}
          DIST_TAG: ${{ steps.check.outputs.dist-tag }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            # npm refuses even a dry run over a version that is already on
            # npm, so dry-run a throwaway prerelease of it instead (this
            # checkout is discarded after the job).
            (cd "$PACKAGE_DIR" && npm version prerelease --preid dryrun --no-git-tag-version --ignore-scripts --workspaces-update=false)
            DIST_TAG=next
          fi
          npm publish "./$PACKAGE_DIR" --dry-run --tag "$DIST_TAG"
